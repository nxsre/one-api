# E2E：与 docker-compose.e2e.yml 配套；较 config.docker.toml 缩短 option/channel 同步周期便于策略类用例收敛
port = 3000
log_dir = "/data/logs"
gin_mode = ""

sql_dsn = "oneapi:123456@tcp(mysql-e2e:3306)/one-api"
redis_conn_string = "redis://redis-e2e:6379/0"
session_secret = "e2e-session-secret-change-me-in-ci"
# 仅首启建 root 时生效（char(32)）；与 tests/e2e 默认 E2E 根访问令牌一致。
# 若复用旧 MySQL 卷且库中 root.access_token 与此不一致，请 down -v 或改库后再跑。
initial_root_access_token = "12345678901234567890123456789012"

sync_frequency = 2

sqlite_path = ""
redis_disabled = false
s3_disabled = true
s3_region = "us-east-1"
s3_clock_skew_seconds = 1800
