# 按集群 Ingress Controller 修改 ingressClassName、host、TLS。
# API 走 worker；控制台如走 primary，可拆第二条 Ingress 或按 path 区分。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: one-api-api
  namespace: one-api
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: one-api-worker
                port:
                  name: http
