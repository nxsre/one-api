# 应用前请替换下方占位符，且勿将真实密钥提交到版本库。
# kubectl apply -f secret-config.yaml
#
# 嵌入式 HTTPS（应用内 RunTLS）：
# - 生产环境常见做法是在 Ingress 上终止 TLS，此处 tls_cert_file / tls_key_file 保持空字符串即可。
# - 若要在 Pod 内直接 TLS，请将证书以 Secret 挂卷（如 type: kubernetes.io/tls）到下方注释中的路径，
#   取消注释 tls_* / https_*，并在 Deployment 中增加对应 volumeMounts、端口与探针：
#   readiness/liveness 的 httpGet 使用 port: https、scheme: HTTPS（详见 docs/kubernetes-deployment.md §4 与 k8s/example/deployment-*.yaml 注释）。
apiVersion: v1
kind: Secret
metadata:
  name: one-api-config
  namespace: one-api
type: Opaque
stringData:
  primary.toml: |
    port = 3000
    log_dir = "/data/logs"
    gin_mode = ""

    node_type = ""

    sql_dsn = "REPLACE_USER:REPLACE_PASS@tcp(REPLACE_MYSQL_HOST:3306)/REPLACE_DB?parseTime=true&loc=Local"
    log_sql_dsn = ""
    sqlite_path = ""
    sqlite_busy_timeout = 3000

    redis_conn_string = "redis://:REPLACE_REDIS_PASS@REPLACE_REDIS_HOST:6379/0"
    redis_disabled = false

    session_secret = "REPLACE_WITH_LONG_RANDOM_STRING"

    sync_frequency = 600
    memory_cache_enabled = true
    theme = "default"
    s3_disabled = false

    # 嵌入式 TLS（可选，与 config.example.toml 一致；不配证书时不要设 https_only = true）
    tls_cert_file = ""
    tls_key_file = ""
    https_only = false
    https_port = "3443"
    # 示例：证书挂载到 /etc/one-api/tls/（需在 Deployment 中挂卷）
    # tls_cert_file = "/etc/one-api/tls/tls.crt"
    # tls_key_file  = "/etc/one-api/tls/tls.key"
    # https_only = false
    # https_port = "3443"
    # 示例：整站仅 HTTPS（端口与 Service/探针需一致，常为 443）
    # port = 443
    # tls_cert_file = "/etc/one-api/tls/tls.crt"
    # tls_key_file  = "/etc/one-api/tls/tls.key"
    # https_only = true
    #
    # 内置 ACME（无 Ingress 时 one-api 直连公网 443；详见 config.acme.example.toml）
    # acme_enabled = true
    # acme_email = "admin@example.com"
    # acme_domains = "api.example.com"
    # acme_storage_dir = "data/acme"
    # acme_http_port = 80
    # 需 PVC 挂载 /data 或单独挂载 data/acme；Service 暴露 80+443
  worker.toml: |
    port = 3000
    log_dir = "/data/logs"
    gin_mode = ""

    node_type = "slave"

    sql_dsn = "REPLACE_USER:REPLACE_PASS@tcp(REPLACE_MYSQL_HOST:3306)/REPLACE_DB?parseTime=true&loc=Local"
    log_sql_dsn = ""
    sqlite_path = ""
    sqlite_busy_timeout = 3000

    redis_conn_string = "redis://:REPLACE_REDIS_PASS@REPLACE_REDIS_HOST:6379/0"
    redis_disabled = false

    session_secret = "REPLACE_WITH_LONG_RANDOM_STRING"

    sync_frequency = 600
    memory_cache_enabled = true
    theme = "default"
    s3_disabled = false

    # 嵌入式 TLS（与 primary 保持一致；证书为同一套时可共用挂载路径）
    tls_cert_file = ""
    tls_key_file = ""
    https_only = false
    https_port = "3443"
    # tls_cert_file = "/etc/one-api/tls/tls.crt"
    # tls_key_file  = "/etc/one-api/tls/tls.key"
    # https_only = false
    # https_port = "3443"
    # 内置 ACME：与 primary 相同配置；acme_storage_dir 需持久卷（见 config.acme.example.toml）

    # 可选：外链控制台/静态资源（主节点会忽略该字段）
    # frontend_base_url = "https://console.example.com"
