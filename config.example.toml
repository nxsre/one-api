# One API — 示例配置（TOML）。可放到 ./config.toml 或通过 -c/--config 指定。
# 键名均为 snake_case，与代码中旧环境变量名对应（大写转小写）。

port = 3000
log_dir = "/app/logs"
gin_mode = ""            # 设为 "debug" 时等价于原 GIN_MODE=debug
channel_test_frequency = 0
batch_update_enabled = false

session_secret = ""
sqlite_path = ""
sql_dsn = ""
log_sql_dsn = ""
sqlite_busy_timeout = 3000

sql_max_idle_conns = 100
sql_max_open_conns = 1000
sql_max_lifetime = 60

debug = false
debug_sql = false
memory_cache_enabled = false
node_type = ""           # "slave" 表示从节点
polling_interval = 0

initial_root_token = ""
initial_root_access_token = ""

sync_frequency = 600
batch_update_interval = 5
relay_timeout = 0
gemini_safety_setting = "BLOCK_NONE"
theme = "default"

global_api_rate_limit = 480
global_web_rate_limit = 240

enable_metric = false
metric_queue_size = 10
metric_success_rate_threshold = 0.8
metric_success_chan_size = 1024
metric_fail_chan_size = 128

gemini_version = "v1"
only_one_log_file = false
relay_proxy = ""
user_content_request_proxy = ""
user_content_request_timeout = 30
enforce_include_usage = false

# Relay 请求审计（JSONL，含请求/响应正文，敏感信息勿在公网路径开启）。默认开启，文件在 log_dir 下的 request_audit/；也可单独指定 request_audit_log_dir。
request_audit_enabled = true
request_audit_log_dir = ""       # 留空则用 log_dir 下的 request_audit/
request_audit_max_body_bytes = 262144

# 进程启动默认：是否允许 Anthropic / Gemini 原生路径在渠道协议不一致时经 OpenAI 语义跨厂商转发。管理端「智能路由」中的选项会覆盖此默认值（需配合模型映射）。
relay_protocol_bridge_enabled = false

test_prompt = "Output only your specific model name with no additional text."

# S3
s3_disabled = false
s3_region = "us-east-1"
s3_max_object_bytes = 33554432
s3_default_ttl_seconds = 86400
s3_max_ttl_seconds = 604800
s3_storage_dir = ""
s3_remote_bucket = ""
s3_remote_endpoint = ""
s3_remote_region = ""
s3_remote_access_key_id = ""
s3_remote_secret_access_key = ""
s3_remote_use_path_style = false
s3_remote_key_prefix = ""
s3_cleaner_interval_seconds = 60
s3_clock_skew_seconds = 1800 # 30 分钟；SigV4 X-Amz-Date 与服务器允许偏差（秒）
s3_cors_allow_origin = ""
s3_addressing = ""

# Redis
redis_disabled = false
redis_conn_string = ""
redis_master_name = ""
redis_password = ""

# 嵌入式 TLS（与 tls_cert_file / tls_key_file 配合；不配证书时不要设置 https_only = true）
tls_cert_file = ""
tls_key_file = ""
https_only = false
https_port = "3443"

force_2fa_for_all_users = false
login_math_captcha_enabled = true
login_brute_trust_x_forwarded_for = false
login_brute_ip_fail_max = 0
login_brute_pair_fail_max = 0
login_brute_fail_window_sec = 0
login_brute_lock_duration_sec = 0

# 登录密码使用 proof 下发的一次性 AES 密钥加密（见 GET /api/user/login/request-proof 的 login_enc_key），无需 RSA 配置。

frontend_base_url = ""
global_access_scope = "relay"

tiktoken_cache_dir = ""

# Nacos CLI 兼容：本地 Skill / AgentSpec 仓库（路径 /nacos/v3/...）
# 启用后可用 nacos-cli 连接本服务（HTTP），例如 ~/.nacos-cli/default.conf：
#   host: "127.0.0.1"
#   port: 3000
#   authType: "nacos"
#   username: "root"
#   password: "你的密码"
#   namespace: "public"
nacos_registry_anonymous_read = true
nacos_registry_max_upload_bytes = 10485760
# Skill/AgentSpec ZIP 与 MCP/A2A/Prompt 大 JSON 负载共用同一存储策略：local（默认）| db | s3（桶使用全局 remote_s3_*）
nacos_registry_zip_storage = "local"
# local 模式：可写根目录；留空则默认 data/nacos-ai-registry（相对进程工作目录）
nacos_registry_zip_local_dir = ""
# s3 模式时对象键前缀（桶使用全局 remote_s3_* 配置）
nacos_registry_s3_key_prefix = "nacos-ai-registry/"
