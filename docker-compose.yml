services:
  one-api:
    image: "one-api:local"
    container_name: one-api
    restart: always
    command: ["--config", "/app/config.toml"]
    ports:
      - "13000:3000"
    volumes:
      - ./data/oneapi:/data
      - ./logs:/app/logs
      # 应用配置（viper TOML）；可改为挂载 ./config.toml
      - ./config.docker.toml:/app/config.toml:ro
    environment:
      # 容器时区（非应用 viper 配置）
      - TZ=Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'" ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: "${REGISTRY:-docker.io}/redis:latest"
    command: ["redis-server"]
    container_name: one-redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: ${MYSQL_IMAGE:-mysql:8.2.0}
    restart: always
    container_name: one-mysql
    volumes:
      - ./data/mysql:/var/lib/mysql  # 挂载目录，持久化存储
    ports:
      - '13306:3306'
    environment:
      TZ: Asia/Shanghai   # 设置时区
      MYSQL_ROOT_PASSWORD: 'OneAPI@justsong' # 设置 root 用户的密码
      MYSQL_USER: oneapi   # 创建专用用户
      MYSQL_PASSWORD: '123456'    # 设置专用用户密码
      MYSQL_DATABASE: one-api   # 自动创建数据库
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
